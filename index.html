<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mekatos Pedidos · Iniciar sesión</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="login" class="pagina-login">
  <main class="login">
    <section class="login__marca">
      <div class="logo" aria-hidden="true">🥟</div>
      <h1>Mekatos <span>Pedidos</span></h1>
      <p>Sistema de pedidos de mecato colombiano. Ingresa con tu cuenta para tomar pedidos.</p>
      <p class="login__nota">Autenticación con <strong>Supabase Auth</strong></p>
    </section>

    <section class="login__tarjeta">
      <h2>Iniciar sesión</h2>
      <form id="form-login" novalidate>
        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" autocomplete="username" placeholder="usuario@correo.com" required>

        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" minlength="6" required>

        <button id="btn-login" class="btn btn--primario" type="submit">Iniciar sesión</button>
      </form>
      <p id="mensaje" class="mensaje" role="alert" hidden></p>
    </section>
  </main>

  <footer class="pie">AA3-EV11 · Integración de autenticación con Supabase Auth · Javier Ortiz</footer>

  <!-- Librería Supabase (UMD, versión fija) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <!-- Configuración -->
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <!-- Modelo -->
  <script src="js/models/AuthModel.js"></script>
  <!-- Vista -->
  <script src="js/views/LoginView.js"></script>
  <!-- Controlador -->
  <script src="js/controllers/LoginController.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
